{% extends "encyclopedia/layout.html" %}

{% block title %}
    Resultados da busca
{% endblock %}

{% block body %}
    <h1>Resultados para "{{ query }}"</h1>

    {% if results %}
        <ul>
            {% for entry in results %}
                <li><a href="{% url 'entry' entry %}">{{ entry }}</a></li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Nenhuma entrada encontrada.</p>
    {% endif %}
{% endblock %}
